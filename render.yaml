services:
  - type: web
    name: kotonowa
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kotonowa-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

databases:
  - name: kotonowa-db
    databaseName: kotonowa_production
    user: kotonowa